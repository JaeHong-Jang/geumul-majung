<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구미 운송 파트너 앱 콜 화면 3종</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="hub">
  <section class="rail" aria-label="버전과 화면 선택">
    <h1>운송 파트너 앱 콜 화면 3종</h1>
    <p class="muted" style="margin:0">화물차 기사용 시안입니다. 세 버전 모두 같은 간격 규칙과 같은 도로 데이터를 씁니다.</p>
    <p style="margin:0"><a href="a/index.html" style="color:#1F5A3F;font-weight:700">A안만 열기</a> · <a href="b/index.html" style="color:#1F5A3F;font-weight:700">B안만 열기</a> · <a href="c/index.html" style="color:#1F5A3F;font-weight:700">C안만 열기</a></p>
    <div id="versions" class="stack"></div>
    <div id="screens" class="snav"></div>
  </section>
  <section aria-label="앱 미리보기"><div id="phone" class="phone"></div></section>
  <section class="side">
    <div class="panel" id="vnote"></div>
    <div class="panel">
      <h2>좌표로 경로 계산</h2>
      <p class="muted" style="margin:0">지도를 누르면 출발과 도착이 번갈아 바뀌고, 400m 안의 공장이 있으면 그 좌표에 붙습니다. 좌표를 직접 넣어도 됩니다.</p>
      <div class="lab-map" id="labmap"></div>
      <div class="stack">
        <label class="field" for="place">주소나 장소 검색<input id="place" placeholder="예: 구미시청"></label>
        <div class="field-row"><button class="lab-btn" type="button" id="placeFrom">출발지로</button><button class="lab-btn" type="button" id="placeTo">도착지로</button></div>
      </div>
      <form id="labform" class="stack">
        <div class="field-row">
          <label class="field" for="fromLat">출발 위도<input id="fromLat" inputmode="decimal"></label>
          <label class="field" for="fromLon">출발 경도<input id="fromLon" inputmode="decimal"></label>
          <label class="field" for="toLat">도착 위도<input id="toLat" inputmode="decimal"></label>
          <label class="field" for="toLon">도착 경도<input id="toLon" inputmode="decimal"></label>
        </div>
        <button class="lab-btn" type="submit">경로 계산</button>
      </form>
      <p class="t12" style="margin:0;color:#9A4E06;font-weight:500">공장 위치는 실제 좌표이고 운임·품목은 예시입니다. 좌표 원본에는 외부 공유 금지 조건이 있습니다.</p>
      <table class="stat-table" id="labstat"></table>
      <p class="muted t12" id="labmeta" style="margin:0"></p>
    </div>
  </section>
</main>
<script src="vendor/leaflet.js"></script>
<script src="data/tiles.js"></script>
<script src="data/factories.js"></script>
<script src="data/road-graph.js"></script>
<script src="dijkstra.js"></script>
<script src="roadnet.js"></script>
<script src="app.js"></script>
</body>
</html>
